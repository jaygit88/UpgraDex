<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UpgraDex</title>
  <meta name="theme-color" content="#6d28d9" />
  <!-- Lets an app installed from this old address update itself to the new one (same app id). -->
  <link rel="manifest" href="app/manifest.webmanifest" />
  <script>
    // The real app now lives in app/ (and the test copy in test/), so the two never overlap.
    location.replace('app/' + location.search + location.hash);
  </script>
</head>
<body style="font-family: system-ui, sans-serif; padding: 2rem">
  <p><a href="app/">Open UpgraDex</a></p>
</body>
</html>
