name: Deploy site (Cloudflare)

# Publishes UpgraDex to https://upgradex.jay-tuck1988.workers.dev as one Cloudflare Worker:
# the real app (main branch) under /app/, the test copy (test branch) under /test/, and a site root
# that forwards to /app/. They sit side by side so phones never mix the two installed apps up.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (the same ones the scanner uses).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Test branch updated"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Updates to main and test can land close together; queue them instead of colliding.
# (Every run rebuilds both copies, so the last one always publishes the latest of each.)
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
          fetch-depth: 0 # full history, so the version number can count the changes

      - name: Is there a test branch?
        id: test
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" test >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.test.outputs.exists == 'true'
        with:
          ref: test
          path: test-src
          fetch-depth: 0

      - name: Assemble site
        run: |
          # Version shown in the app's header: v<number of changes>, plus the date of the newest one.
          write_version() {
            n=$(git -C "$2" rev-list --count HEAD)
            sha=$(git -C "$2" rev-parse --short HEAD)
            date=$(git -C "$2" log -1 --format=%cI)
            printf "export const BUILD = { label: 'v%s', sha: '%s', date: '%s' };\n" "$n" "$sha" "$date" > "$1/js/version.js"
          }
          copy_app() {
            mkdir -p "$1"
            cp -r "$2"/. "$1"/
            rm -rf "$1"/.git "$1"/.github "$1"/scanner "$1"/site-root "$1"/scripts
          }
          mkdir -p site
          cp -r main-src/site-root/. site/
          copy_app site/app main-src
          write_version site/app main-src
          if [ -d test-src ]; then
            copy_app site/test test-src
            node main-src/scripts/make-test-site.mjs site/test
            write_version site/test test-src
          fi
          python3 main-src/scripts/pack-site.py site worker

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4 deploy
