name: Deploy to GitHub Pages

# Publishes the real app (main branch) under /app/ and the test copy (test branch) under /test/.
# They sit side by side (neither inside the other) so phones never mix the two installed apps up.
# The site root just forwards to /app/.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Test branch updated"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Updates to main and test can land close together; queue them instead of colliding.
# (Every run rebuilds both copies, so the last one always publishes the latest of each.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-src
          fetch-depth: 0 # full history, so the version number can count the changes

      - name: Is there a test branch?
        id: test
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" test >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.test.outputs.exists == 'true'
        with:
          ref: test
          path: test-src
          fetch-depth: 0

      - name: Assemble site
        run: |
          # Version shown in the app's header: v<number of changes>, plus the date of the newest one.
          write_version() {
            n=$(git -C "$2" rev-list --count HEAD)
            sha=$(git -C "$2" rev-parse --short HEAD)
            date=$(git -C "$2" log -1 --format=%cI)
            printf "export const BUILD = { label: 'v%s', sha: '%s', date: '%s' };\n" "$n" "$sha" "$date" > "$1/js/version.js"
          }
          mkdir -p site/app
          cp -r main-src/site-root/. site/
          touch site/.nojekyll
          cp -r main-src/. site/app/
          rm -rf site/app/.git site/app/.github site/app/scanner site/app/site-root
          write_version site/app main-src
          if [ -d test-src ]; then
            mkdir -p site/test
            cp -r test-src/. site/test/
            rm -rf site/test/.git site/test/.github site/test/scanner site/test/site-root
            node main-src/scripts/make-test-site.mjs site/test
            write_version site/test test-src
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # GitHub can still be finishing the previous publish (e.g. a test-branch update a minute earlier),
      # which makes this step fail with "in progress deployment". Wait and try again rather than fail.
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait for the previous publish to finish
        if: steps.first.outcome == 'failure'
        run: sleep 90
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - id: deployment
        run: echo "page_url=${{ steps.second.outputs.page_url || steps.first.outputs.page_url }}" >> "$GITHUB_OUTPUT"
